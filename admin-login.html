<!doctype html>
<html<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Admin Login | THIOBEEMS</title><link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<div id="header"></div>
	<main class="auth-page">
		<div class="auth-card">
			<div class="logo-center">
				<span class="logo-mark admin">A</span>
				<h2>Administrator Login</h2>
			</div>
			<form id="adminLogin">
				<label>Username<input id="adminUser" required value="admin"></label>
				<label>Password<input id="adminPassword" type="password" required placeholder="admin123"></label>
				<button class="btn primary full">Sign in</button>
				<p id="adminMessage" class="message" hidden></p>
			</form>
			<p class="muted">Demo credentials: admin / admin123</p>
		</div>
	</main>
	<div id="footer"></div>
	<script src="assets/js/main.js">
		
	</script>
</body>
</html>
