<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Admission | THIOBEEMS University</title>
	<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
	<div id="header"></div>
	<main>
		<section class="page">
			<div class="container">
				<span class="eyebrow">Online Admission</span>
				<h1>Apply to THIOBEEMS.</h1>
				<p>Complete this application form to begin your admission journey.</p>
			</div>
		</section>
		<section class="section">
			<div class="container form-wrap">
				<form id="admissionForm" class="form">
					<div class="form-grid">
						<label>First Name<input name="firstName" required></label>
						<label>Last Name<input name="lastName" required></label>
						<label>Email<input type="email" name="email" required></label>
						<label>Phone<input name="phone" required></label>
						<label>Date of Birth<input type="date" required></label>
						<label>Programme<select name="programme" required>
							<option value="">Select programme</option>
							<option>BSc Computer Science</option>
							<option>BSc Software Engineering</option>
							<option>BBA Business Administration</option>
							<option>BSc Accounting & Finance</option>
							<option>BSc Public Health</option>
							<option>BA Economics</option>
						</select>
					</label>
				</div>
				<label>Address<textarea name="address" rows="3" required></textarea></label>
				<label>Highest qualification<select required><option value="">Select</option>
					<option>GCE Advanced Level</option>
					<option>HND</option>
					<option>Bachelor's Degree</option>
					<option>Master's Degree</option>
					<option>Other</option>
				</select>
			</label>
			<label>Upload documents<input type="file" multiple></label>
			<label class="check"><input type="checkbox" required> I confirm that the information provided is accurate.</label>
			<button class="btn primary" type="submit">Submit Admission Application</button>
			<div id="admissionMessage" class="message" hidden></div>
		</form>
	</div>
</section>
</main>
<div id="footer"></div>
<script src="main.js"></script>
</body>
</html>
